[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hostaway"
dynamic = ["version"]
description = "Hostaway integration for Home Assistant"
requires-python = ">=3.14.2"
license = { text = "Apache-2.0" }

# Home Assistant ships httpx itself, and the integration consumes it through
# homeassistant.helpers.httpx_client.get_async_client() rather than building
# its own AsyncClient, so declaring it here would pin a package we do not
# manage. An exact pin is also a latent conflict: it breaks resolution as soon
# as Home Assistant moves to a different httpx.
#
# Separately, hassfest reads custom_components/hostaway/manifest.json, not this
# file, and rejects Home Assistant's own dependencies there with
# "[REQUIREMENTS] Requirement httpx is a dependency of Home Assistant itself
# and must not be listed in the manifest of a custom integration". Keep httpx
# out of that manifest too.
dependencies = []

[project.optional-dependencies]
test = [
    "homeassistant>=2026.7.2",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "pytest-homeassistant-custom-component>=0.13.340",
    "respx>=0.22",
]

[dependency-groups]
dev = [
    "homeassistant>=2026.7.2",
    "interrogate>=1.7",
    "mypy>=2.3.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "pytest-homeassistant-custom-component>=0.13.340",
    "respx>=0.22",
    "ruff>=0.15.21",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "v(?P<version>.*)"

[tool.hatch.build.targets.wheel]
packages = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = "pytest_homeassistant_custom_component.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "homeassistant.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "voluptuous.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.interrogate]
fail-under = 100
verbose = 2
