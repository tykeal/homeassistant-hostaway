---
ignore:
  # urllib3 is a transitive dependency pulled in via homeassistant and
  # test deps (pytest-homeassistant-custom-component, etc.). This
  # integration's runtime code depends directly on httpx, not urllib3,
  # so we cannot bump the urllib3 pin from this project. The advisory
  # is fixed in urllib3 >= 2.7.0; remove this entry once the upstream
  # dependency chain ships a compatible release.
  - vulnerability: GHSA-mf9v-mfxr-j63j
    package:
      name: urllib3
      type: python
  # Same rationale as above: transitive via homeassistant / test deps,
  # integration runtime uses httpx, fix lands in urllib3 >= 2.7.0.
  # Remove once the upstream chain updates.
  - vulnerability: GHSA-qccp-gfcp-xxvc
    package:
      name: urllib3
      type: python
  # idna is a transitive dependency (pulled in via httpx and other
  # test/dev deps). The integration's runtime does not depend on idna
  # directly. Advisory GHSA-65pc-fj4g-8rjx is fixed in idna >= 3.15;
  # remove this entry once the upstream dependency chain ships idna >= 3.15.
  - vulnerability: GHSA-65pc-fj4g-8rjx
    package:
      name: idna
      type: python
  # cryptography is a transitive dependency pulled in via
  # homeassistant core. This integration does not depend on
  # cryptography directly. The advisory is fixed in cryptography >=
  # 50.0.0; remove once upstream updates.
  - vulnerability: GHSA-g6cj-pr64-35w5
    package:
      name: cryptography
      type: python
  # Future-dated urllib3 advisories are transitive through the
  # Home Assistant test/runtime dependency set. Home Assistant pins the
  # compatible urllib3 version, so this integration cannot safely
  # override it independently. Remove when upstream ships urllib3 >=
  # 2.8.0 or the advisories are withdrawn.
  - vulnerability: GHSA-vxq7-64xx-v4gw
    package:
      name: urllib3
      type: python
  - vulnerability: GHSA-8988-9cw3-xx77
    package:
      name: urllib3
      type: python
  - vulnerability: GHSA-gh4c-6fx4-qh6g
    package:
      name: urllib3
      type: python
  # Future-dated cryptography advisories are likewise pinned by Home
  # Assistant. Remove when upstream ships cryptography >= 49.0.0 or
  # the advisories are withdrawn.
  - vulnerability: GHSA-jwv3-5hgf-82ww
    package:
      name: cryptography
      type: python
  - vulnerability: GHSA-m2h6-j472-rp4c
    package:
      name: cryptography
      type: python
  # PyJWT is a transitive Home Assistant dependency. Home Assistant
  # currently pins 2.13.0; remove these ignores when upstream ships a
  # version satisfying the fixed ranges or the advisories are withdrawn.
