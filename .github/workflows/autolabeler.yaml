name: 'Autolabeler'

# yamllint disable-line rule:truthy
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  # pull_request_target runs with a write token in the base repo's
  # context, which is what lets fork pull requests get labelled at
  # all. It is only safe because the autolabel job never checks out
  # or executes anything from the pull request head: its only steps
  # are harden-runner and the autolabeler action, which reads the
  # pull request title and body through the GitHub API.
  # zizmor: ignore[dangerous-triggers] no PR content is executed
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ format('al-{0}-pr-{1}', github.event_name, github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  autolabel:
    name: 'Autolabel PR'
    # Run on pull_request_target for forks, pull_request for
    # same-repo PRs to prevent duplicate runs
    # yamllint disable rule:line-length
    if: >
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.fork) ||
      (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
    # yamllint enable rule:line-length
    # SECURITY: see the pull_request_target note on the trigger — the
    # write grant below is safe because this job never checks out or
    # runs any code from the pull request head.
    permissions:
      contents: read  # Read the autolabel rules from the repo
      pull-requests: write  # Apply the computed labels to the PR
    runs-on: 'ubuntu-latest'
    timeout-minutes: 3
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
